name: cicd

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short sha
        shell: bash
        id: sha
        run: echo "sha=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: haydn202/python-app:${{ steps.sha.outputs.sha }}
      
  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      - name: install argocdCLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd-linux-amd64
          sudo mv argocd-linux-amd64 /usr/local/bin/argocd
          
      - name: ArgoCD Sync
        run: |
          argocd login argocd-server.argocd \
            --insecure --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app set python-app --helm-set "image.tag=${{ needs.ci.outputs.image_tag }}"
          argocd app sync python-app